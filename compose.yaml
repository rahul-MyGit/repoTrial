services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repotrial
      POSTGRES_USER: repotrial
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repotrial -d repotrial"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
